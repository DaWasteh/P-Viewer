name: Signed desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-22.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Linux system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=low

      - name: Verify version and signing configuration
        shell: bash
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.P_VIEWER_UPDATER_PUBKEY }}
          SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node scripts/check-version.mjs "${GITHUB_REF_NAME}"
          test -n "$UPDATE_PUBLIC_KEY" || { echo "Missing repository variable P_VIEWER_UPDATER_PUBKEY" >&2; exit 1; }
          test -n "$SIGNING_PRIVATE_KEY" || { echo "Missing secret TAURI_SIGNING_PRIVATE_KEY" >&2; exit 1; }
          test -n "$SIGNING_PRIVATE_KEY_PASSWORD" || { echo "Missing secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD" >&2; exit 1; }
          node --input-type=module -e 'import { readFileSync } from "node:fs"; const config = JSON.parse(readFileSync("src-tauri/tauri.release.conf.json", "utf8")); const embedded = config.plugins?.updater?.pubkey?.trim(); if (embedded !== process.env.UPDATE_PUBLIC_KEY.trim()) { console.error("Embedded updater public key does not match P_VIEWER_UPDATER_PUBKEY."); process.exit(1); }'

      - name: Verify file association metadata
        run: npm run check:associations

      - name: Check Svelte and TypeScript
        run: npm run check

      - name: Run frontend tests
        run: npm test

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Run production-build browser regressions
        run: npm run test:browser

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  release:
    name: Build ${{ matrix.name }}
    needs: verify
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux system packages
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Build signed draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          P_VIEWER_UPDATE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          P_VIEWER_UPDATER_PUBKEY: ${{ vars.P_VIEWER_UPDATER_PUBKEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "P-Viewer ${{ github.ref_name }}"
          releaseBody: |
            Signierte Desktop-Builds für Windows, Linux sowie macOS auf Intel und Apple Silicon.

            Änderungen stehen im Changelog. Der Release wird erst veröffentlicht, wenn alle vier Plattformpakete samt Signaturen und `latest.json` vorliegen.
          releaseDraft: true
          prerelease: false
          generateReleaseNotes: true
          updaterJsonPreferNsis: true
          retryAttempts: 2
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.args }}

  publish:
    name: Publish release
    # The matrix jobs upload into a draft so the updater endpoint never sees a
    # half-finished release; once every platform succeeded the draft goes live.
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Verify release assets and updater manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[].name' | tee assets.txt
          for suffix in \
            _x64-setup.exe _x64-setup.exe.sig \
            _amd64.AppImage _amd64.AppImage.sig _amd64.deb _amd64.deb.sig .x86_64.rpm .x86_64.rpm.sig \
            _aarch64.dmg _aarch64.app.tar.gz _aarch64.app.tar.gz.sig \
            _x64.dmg _x64.app.tar.gz _x64.app.tar.gz.sig; do
            grep -q -- "${suffix}\$" assets.txt || { echo "Missing release asset *${suffix}" >&2; exit 1; }
          done
          gh release download "$TAG" --pattern latest.json --output latest.json
          jq -e --arg version "${TAG#v}" \
            '.version == $version and (.platforms | has("windows-x86_64") and has("linux-x86_64") and has("darwin-x86_64") and has("darwin-aarch64"))' \
            latest.json

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false --latest
