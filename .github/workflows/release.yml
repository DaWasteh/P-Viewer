name: Signed desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-latest
          - macos-latest
          - ubuntu-22.04

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux system packages
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify release configuration
        shell: bash
        env:
          UPDATE_PUBLIC_KEY: ${{ vars.PANDAVIEWER_UPDATER_PUBKEY }}
          SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node scripts/check-version.mjs "${GITHUB_REF_NAME}"
          test -n "$UPDATE_PUBLIC_KEY" || { echo "Missing repository variable PANDAVIEWER_UPDATER_PUBKEY" >&2; exit 1; }
          test -n "$SIGNING_PRIVATE_KEY" || { echo "Missing secret TAURI_SIGNING_PRIVATE_KEY" >&2; exit 1; }

      - name: Build signed draft release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PANDAVIEWER_UPDATE_ENDPOINT: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          PANDAVIEWER_UPDATER_PUBKEY: ${{ vars.PANDAVIEWER_UPDATER_PUBKEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PandaViewer ${{ github.ref_name }}"
          releaseBody: |
            Signierte Desktop-Builds für Windows, macOS und Linux.

            Vor der Veröffentlichung bitte Installations-Smoke-Tests durchführen und den Entwurf manuell freigeben.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: --config src-tauri/tauri.release.conf.json
