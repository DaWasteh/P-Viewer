<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="P-Viewer – schneller Editor und Dokumentbetrachter für Text, Code, Markdown und LaTeX"
    />
    <title>P-Viewer</title>
    <!--
      Keep this shell free of inline style and script elements: Tauri adds
      their hashes to the CSP, which makes browsers ignore 'unsafe-inline' and
      blocks the style elements CodeMirror injects at runtime. The native window
      background comes from windows.rs instead (see src/app.test.ts).
    -->
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
